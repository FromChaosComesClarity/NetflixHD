<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#241818" />
      <stop offset="100%" stop-color="#0b0808" />
    </radialGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1212" />
      <stop offset="100%" stop-color="#060404" />
    </linearGradient>
    <!-- A curtain-red glow rising from the bottom of the screen: cinema, not a logo -->
    <radialGradient id="glow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#ff2a2a" stop-opacity=".95" />
      <stop offset="45%" stop-color="#b20710" stop-opacity=".55" />
      <stop offset="100%" stop-color="#b20710" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <rect x="44" y="118" width="424" height="250" rx="18" fill="#141010" stroke="#3a3232" stroke-width="5" />
  <rect x="56" y="130" width="400" height="226" rx="10" fill="url(#screen)" />
  <rect x="56" y="130" width="400" height="226" rx="10" fill="url(#glow)" />

  <!-- Curtain folds -->
  <g stroke="#ff4d4d" stroke-opacity=".22" stroke-width="3" fill="none">
    <path d="M 96 356 C 104 280, 92 200, 100 130" />
    <path d="M 416 356 C 408 280, 420 200, 412 130" />
  </g>

  <path d="M 230 198 L 296 243 L 230 288 Z" fill="#ffffff" />

  <rect x="384" y="314" width="58" height="30" rx="7" fill="#e50914" />
  <text x="413" y="336" text-anchor="middle" font-family="Poppins, Inter, Arial, sans-serif" font-weight="800" font-size="20" fill="#ffffff">HD</text>

  <path d="M 226 368 L 286 368 L 300 404 L 212 404 Z" fill="#2a2525" />
  <rect x="168" y="400" width="176" height="10" rx="5" fill="#3a3232" />
</svg>
